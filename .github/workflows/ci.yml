# Preflight's own CI. This is not the consumer-side `preflight check` step that
# SPEC §9.1 records as residual risk #1 — that one each consuming repo hand-adds.
#
# Actions are SHA-pinned. SPEC §8 found a floating tag still running a deprecated
# Node version in the repo Preflight was extracted from; the same hazard applies
# here, and the tag each SHA came from is in the trailing comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Commit linting below needs the PR's commits, not just their tip.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Preflight lints its own commits with the preset it ships. Until now
      # `@commitlint/cli` was a devDependency invoked by nothing — a tool
      # installed and run by nobody, which is this project's own definition of
      # dead config (ADR-0003, ADR-0008). This step is what makes it live.
      #
      # CI rather than a `commit-msg` hook, for the reason SPEC §6 gives when it
      # rejects hooks for drift: a hook is bypassable with `--no-verify`. It also
      # sidesteps ADR-0008's unresolved half — Preflight cannot cause a hook to
      # exist, because `package.json` is beyond both of SPEC §4's mechanisms, but
      # it can add a CI step to its own repo.
      #
      # One commit at a time through stdin, and deliberately NOT
      # `commitlint --from X --to Y`. The range form is the standard CI recipe and
      # it is wrong: measured against @commitlint/cli 21.2.1 it mangles commit
      # bodies, reporting 14 false `body-max-line-length` errors on a corpus whose
      # longest body line is 83 characters, plus 6 spurious `footer-leading-blank`
      # warnings. The same commits linted individually report none of them.
      #
      # `--no-merges` matters: on a pull_request event the checked-out HEAD is
      # GitHub's merge ref, whose own commit message is not a conventional commit
      # and is not authored by anyone here.
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA"..HEAD); do
            if ! git log -1 --format=%B "$sha" | pnpm exec commitlint; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") fails the commitlint preset"
              failed=1
            fi
          done
          exit "$failed"

      - name: Typecheck
        run: pnpm run typecheck

      # Preflight lints its own Markdown with the preset it ships, for the same
      # reason the commitlint step above exists: a preset this repo publishes and
      # never runs is a rule set nobody has tested against real prose. ADR-0013
      # measured which rules to ship against the two consumers and never against
      # this repo, which is 26 authored files of exactly the documentation-heavy
      # kind the preset is for.
      #
      # `.markdownlint.json` extends `./presets/markdownlint.json` by relative
      # path rather than the `@victortolbert/preflight/markdownlint` subpath, for
      # the reason `commitlint.config.ts` gives: consuming the subpath would need
      # the package installed into itself. `test/stability.test.ts` already
      # asserts the shipped subpath resolves to that same file.
      #
      # Two local rules, neither of them shippable:
      #
      #   MD049 `style: asterisk` — the preset leaves this at the default
      #   `consistent`, which is per-FILE and so blesses a repo whose files
      #   disagree with each other. Measured here: 26 violations under asterisk
      #   against 252 under underscore, so asterisk is this repo's convention by
      #   an order of magnitude. That is a fact about this repo, not about the
      #   consumers, so it stays local — ADR-0013's criterion governs the preset.
      #
      #   MD029 — disabled inline in SPEC.md only, around backlog items 9 and 10.
      #   Worth knowing: that rule is auto-fixable and its fix is DESTRUCTIVE.
      #   `markdownlint --fix` silently renumbers those to 1 and 2, breaking every
      #   "§10.9"/"§10.10" citation in the SPEC, the ADRs and the handoffs.
      #   ADR-0013's shipping criterion uses "survives `--fix`" as a proxy for
      #   "worth disabling"; this is the case that shows fixable does not mean
      #   safe to fix.
      - name: Lint Markdown
        run: pnpm run lint:md

      # Issue #1 asks for build → packaging checks → tests, which inverts the
      # order SPEC §12 lists the layers in. Deliberate: packaging is the layer
      # unit and integration tests cannot substitute for — a missing `files`
      # entry, a subpath that resolves locally and 404s from the registry, an
      # absent declaration file — so it should fail first and fail loudly.
      - name: Build
        run: pnpm run build

      - name: Packaging checks
        run: pnpm run check:packaging

      - name: Test
        run: pnpm run test
